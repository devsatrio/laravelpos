services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravelpos_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel

  webserver:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - laravel

  db:
    image: mysql:5.7
    container_name: laravelpos_db
    environment:
      MYSQL_DATABASE: db_laravel_pos
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravelpos
      MYSQL_PASSWORD: laravelpos
    ports:
      - "3307:3306"
    networks:
      - laravel

networks:
  laravel: