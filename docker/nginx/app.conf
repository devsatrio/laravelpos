server {
    listen 80;
    server_name localhost;
    index index.php index.html;
    root /var/www/public;

    # 1. Redirect jika membuka root atau /laravelpos tanpa sub-path
    location = / {
        return 302 /laravelpos/backend/home;
    }

    location = /laravelpos {
        return 302 /laravelpos/backend/home;
    }

    location = /laravelpos/ {
        return 302 /laravelpos/backend/home;
    }

    # 2. Tangani file statis (CSS, JS, gambar, font) di bawah /laravelpos/
    location ~* ^/laravelpos/(.+\.(jpg|jpeg|gif|png|ico|css|js|woff2|woff|ttf|svg|eot))$ {
        alias /var/www/public/$1;
        expires max;
        log_not_found off;
    }

    # 3. Tangani semua routing dan AJAX di bawah /laravelpos/
    location /laravelpos/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /laravelpos/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # 4. Fallback jika ada akses langsung
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    }
}