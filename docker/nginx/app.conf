server {
    listen 80;
    server_name localhost;
    index index.php index.html;
    root /var/www/public;

    client_max_body_size 64M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    absolute_redirect off;

    # 1. Redirect jika membuka root atau /laravelpos tanpa sub-path
    location = / {
        return 302 /laravelpos/backend/home;
    }

    location = /laravelpos {
        return 302 /laravelpos/backend/home;
    }

    location = /laravelpos/ {
        return 302 /laravelpos/backend/home;
    }

    # 2. Tangani file statis (CSS, JS, gambar, font) di bawah /laravelpos/
    location ~* ^/laravelpos/(.+\.(jpg|jpeg|gif|png|ico|css|js|woff2|woff|ttf|svg|eot))$ {
        alias /var/www/public/$1;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        log_not_found off;
    }

    # 3. Tangani semua routing dan AJAX di bawah /laravelpos/
    location /laravelpos/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /laravelpos/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    # 4. Fallback jika ada akses langsung
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }
}
